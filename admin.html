<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UniVault</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <div>
      <div class="brand">UniVault</div>
    </div>
    <div class="row">
      <button id="btnConnect" class="btn">Connect Wallet</button>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Setup</h2>
      <div class="row">
        <div>
          <label>Contract Address</label>
          <input id="inpContract" type="text" placeholder="0x... (UniVaultRegistry deployed address)" />
        </div>
        <div>
          <label>Pinata JWT</label>
          <input type="password" id="inpPinataJWT" placeholder="pin_eyJhbGciOi..." />
        </div>
      </div>
      <div class="row">
        <div>
          <label>Issuer (your wallet) <span class="subtle">auto-fills after connect</span></label>
          <input id="inpIssuer" type="text" placeholder="0x..." disabled />
        </div>
        <div>
          <label>Chain</label>
          <input id="inpChain" type="text" placeholder="Chain from wallet" disabled />
        </div>
      </div>
    </section>

    <div class="grid" style="display: grid; grid-template-columns: 2fr; justify-items: center;">
      <section class="panel" style="width: 590px;">
        <h2>Upload & Issue Credential</h2>
        <label>Subject Address</label>
        <input id="issueSubject" type="text" placeholder="0x... student wallet" />

        <label>Credential File</label>
        <input id="issueFile" type="file" accept="application/pdf,image/*,.json" />

        <div class="row">
          <div>
            <label>Optional Expiry</label>
            <input id="issueExpiry" type="datetime-local" />
          </div>
          <div>
            <label>On-chain hash strategy</label>
            <select id="issueHashStrategy">
              <option value="bytes">keccak256(file bytes) — recommended</option>
              <option value="cid">keccak256(CID string) — quick & lossy</option>
            </select>
          </div>
        </div>

        <div class="row" style="margin-top:12px;">
          <button id="btnUpload" class="btn">1) Upload to Pinata</button>
          <button id="btnIssue" class="btn primary" disabled>2) Issue Credential</button>
        </div>

        <h3>Upload Result</h3>
        <div class="kvs">
          <div>CID</div>
          <div id="cidOut" class="mono">—</div>
          <div>Gateway</div>
          <div><a id="cidLink" class="link" href="#" target="_blank">—</a></div>
          <div>keccak256(bytes)</div>
          <div id="kecBytes" class="mono">—</div>
          <div>keccak256(CID)</div>
          <div id="kecCid" class="mono">—</div>
        </div>

        <h3>Issue Tx</h3>
        <div class="status" id="issueStatus">—</div>

        <div>SHA-256 vs CID</div>
        <div class="mono" id="shaCheck">—</div>
      </section>

      <section class="panel" style="width: 600px;">
        <h2>Verify or Read or Revoke</h2>
        <label>Credential ID</label>
        <input id="credId" type="text" placeholder="e.g. 1" />

        <div class="row" style="margin-top:4px;">
          <button id="btnRead" class="btn">Read</button>
          <button id="btnRevoke" class="btn danger">Revoke</button>
        </div>

        <h3>Verify Against File</h3>
        <label>File to Verify</label>
        <input id="verifyFile" type="file" accept="application/pdf,image/*,.json" />
        <div class="row" style="margin-top:8px;">
          <button id="btnVerify" class="btn">Call verifyCredential</button>
        </div>

        <h3>Result</h3>
        <div id="verifyStatus" class="status">—</div>

        <h3>Current Credential</h3>
        <div id="readStatus" class="status">—</div>
      </section>
    </div>

  </main>


  <div id="errOverlay"><strong>Error during runtime</strong>
    <pre id="errText"></pre>
  </div>


  <script type="module" src="./js_scripts.js"></script>
</body>

</html>
