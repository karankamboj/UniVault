<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniVault Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white p-8 md:p-10 rounded-xl shadow-2xl border border-gray-100">

        <header class="text-center mb-8">
            <div class="flex justify-center items-center mb-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.464 9.299 5 7.5 5S4.168 5.464 3 6.253M12 6.253C13.168 5.464 14.701 5 16.5 5S19.832 5.464 21 6.253M12 6.253v13m-6 0h12M6 13h12" />
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">UniVault</h1>
            <p class="text-sm text-gray-500 mt-1">Securely access your academic portal</p>
        </header>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-6">
            
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="••••••••"
                    required
                    class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-150"
                >
            </div>

            <div id="messageBox" class="text-center hidden p-3 rounded-lg text-sm transition-all duration-300">
            </div>

            <div>
                <button
                    type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200 ease-in-out transform hover:scale-[1.01] active:scale-[0.99]"
                >
                    Sign In
                </button>
            </div>
        </form>

    </div>

    <script>
        function showMessage(text, isError = true) {
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = text;
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'border', 'border-red-300', 'border-green-300');
            
            if (isError) {
                messageBox.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-300');
            } else {
                messageBox.classList.add('bg-green-100', 'text-green-700', 'border', 'border-green-300');
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            let redirectUrl = null;

            if (username === 'admin' && password === 'admin') {
                redirectUrl = 'admin.html';
            } 
            else if (username === 'student' && password === 'student') {
                redirectUrl = 'student.html';
            } 
            else {
                showMessage("Invalid username or password. Please try again.", true);
                return;
            }
            window.location.href = redirectUrl; 
        }

    </script>
</body>
</html>
